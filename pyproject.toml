[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader-cjrtools"
version = "1.0.0"
description = "Downloader modular e resiliente de arquivos e mídias do Telegram com suporte a retomada, verificação de integridade e catálogo CSV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "platformdirs>=3.0.0,<5.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line too long handled by formatter/tqdm
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
